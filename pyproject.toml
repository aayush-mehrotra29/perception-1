[project]
name = "classroom-lab"
version = "0.1.0"
description = "A research-backed lesson-testing prototype"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "python-multipart>=0.0.9,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
research = ["scikit-learn>=1.5,<2", "numpy>=1.26,<3"]
cloud = ["modal>=1.2,<2", "openai>=2,<3", "meta-sam-parser", "huggingface-hub>=0.35,<2"]
media = ["av>=18,<19", "pillow>=11,<14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
