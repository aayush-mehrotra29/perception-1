[project]
name = "perception-speech-eeg-v2"
version = "0.2.0"
description = "Isolated speech-to-EEG development and matched TRIBE transfer evaluation"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=2,<3", "torch>=2.6,<3", "scipy>=1.16,<2", "scikit-learn>=1.7,<2"]

[project.optional-dependencies]
research = ["mne>=1.10,<2", "matplotlib>=3.10,<4", "pytest>=8,<10", "pydantic>=2,<3"]
cloud = ["modal"]

[tool.pytest.ini_options]
testpaths = ["tests", "lesson_harness_v1/tests", "numerical_brain_v1/tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
